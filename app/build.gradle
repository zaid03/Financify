plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.0.14'
    id 'org.beryx.jlink' version '3.1.3'
}

repositories {
    mavenCentral()
}

javafx {
    version = "21"
    modules = [ 'javafx.controls' ]
}

dependencies {
    testImplementation libs.junit.jupiter

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    implementation libs.guava
    implementation 'org.xerial:sqlite-jdbc:3.46.0.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainModule = 'com.financify'
    mainClass = 'com.financify.App'
}

tasks.named('test') {
    useJUnitPlatform()
}

jlink {
    launcher {
        name = 'Financify'
    }

    jpackage {
        appVersion = "1.0.0"
        vendor = "Zaid Terguy"
        description = "Personal finance manager built with JavaFX"
        installerOptions = [
            '--win-menu',
            '--win-shortcut'
        ]
        imageName = 'Financify'
        installerName = 'Financify'
        icon = 'src/main/resources/images/icon.ico'
    }
}